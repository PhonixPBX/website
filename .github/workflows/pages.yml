name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild daily so the download section picks up the latest nightly build.
  schedule:
    - cron: "30 7 * * *"
  # Lets the PhonixPBX repo trigger a rebuild after publishing a release:
  #   gh api repos/PhonixPBX/website/dispatches -f event_type=release
  repository_dispatch:
    types: [release]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies (Hugo, Tailwind CSS, daisyUI)
        run: npm ci

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_GITHUB_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npx hugo --minify --gc ${BASE_URL:+--baseURL "$BASE_URL/"}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
