<section id="screenshots" class="bg-base-200 py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6">
    {{ partial "section-head.html" (dict
      "eyebrow" "Screenshots"
      "title" "A web interface that stays out of your way"
      "text" "Tabler and htmx, in the classic AskoziaPBX colours — fast, responsive and with a dark mode."
    ) }}
    <div class="mt-14 grid gap-8 md:grid-cols-2">
      {{- range hugo.Data.screenshots }}
      <figure class="overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-sm">
        {{ partial "screenshot.html" (dict "title" .title "src" .src) }}
        <figcaption class="border-t border-base-300 px-5 py-4">
          <span class="font-semibold text-primary">{{ .title }}</span>
          <span class="text-base-content/70"> — {{ .caption }}</span>
        </figcaption>
      </figure>
      {{- end }}
    </div>
  </div>
</section>
