{{- /* Shared modal for enlarged screenshots, filled by scripts.html from [data-lightbox] buttons. */ -}}
<dialog id="lightbox" class="modal">
  <div class="modal-box w-11/12 max-w-7xl overflow-hidden p-0">
    <form method="dialog">
      <button class="btn btn-circle btn-sm absolute right-2 top-2 border-base-300 bg-base-100/80" aria-label="Close">
        {{ partial "icon.html" (dict "name" "x" "class" "size-4") }}
      </button>
    </form>
    <img data-lightbox-img src="data:," alt="" class="w-full">
    <p class="border-t border-base-300 px-5 py-4">
      <span data-lightbox-title class="font-semibold text-primary"></span>
      <span data-lightbox-caption class="text-base-content/70"></span>
    </p>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
