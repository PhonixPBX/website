{{- $items := slice "Asterisk 22" "Alpine Linux" "PJSIP" "FastAPI" "Python3" "SQLite" "Nginx" "htmx4" "Tabler UI" -}}
<section class="border-b border-base-300 bg-base-200" aria-label="Built on">
  <div class="mx-auto flex max-w-7xl flex-col items-center gap-4 px-4 py-6 sm:px-6 md:flex-row md:justify-between">
    <p class="text-sm font-medium text-base-content/60">Built on proven open source</p>
    <ul class="flex flex-wrap justify-center gap-x-6 gap-y-2 text-sm font-semibold text-base-content/75">
      {{- range $items }}<li>{{ . }}</li>{{ end }}
    </ul>
  </div>
</section>
